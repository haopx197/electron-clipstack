appId: com.clipstack.app
productName: ClipStack
directories:
    buildResources: build
files:
    - "!**/.vscode/*"
    - "!src/*"
    - "!electron.vite.config.{js,ts,mjs,cjs}"
    - "!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}"
    - "!{.env,.env.*,.npmrc,pnpm-lock.yaml}"
    - "!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}"
asarUnpack:
    # Tray icons live in Resources (unpacked from asar so they're accessible
    # as regular files at runtime). Helper is NOT unpacked here — it's placed
    # in Contents/Frameworks/ via `extraFiles` below so Launch Services
    # indexes it as a proper .app bundle (custom icon + stable TCC identity).
    - resources/trayIconTemplate*.png
extraFiles:
    - from: resources/ClipStackHelper.app
      to: Frameworks/ClipStackHelper.app
win:
    executableName: clipstack
nsis:
    artifactName: ${name}-${version}-setup.${ext}
    shortcutName: ${productName}
    uninstallDisplayName: ${productName}
    createDesktopShortcut: always
mac:
    category: public.app-category.utilities
    minimumSystemVersion: "11.0"
    # Build unsigned: set `CSC_IDENTITY_AUTO_DISCOVERY=false` when running
    # `npm run build:mac`. install.sh uses `xattr -cr` to avoid the Gatekeeper
    # warning. Do NOT hardcode `identity: null` (skipping signing entirely
    # produces a broken bundle) and do NOT run `codesign --deep --force`
    # manually on the .app — both cause `task_name_for_pid: (os/kern)
    # failure (5)` on launch.
    target:
        - target: dmg
          arch:
              - arm64
              - x64
    entitlementsInherit: build/entitlements.mac.plist
    # Do NOT add NSAccessibilityUsageDescription here. The .app bundle itself
    # never requests AX — only the standalone ClipStackHelper binary does. If
    # we advertise the AX usage description in the app's Info.plist, macOS
    # pre-populates ClipStack.app into System Settings → Accessibility as a
    # "prospective" entry that toggling has no effect on (it isn't the process
    # doing the CGEvent post). Users see two entries ("App 1" with the correct
    # icon and "App 2 / ClipStackHelper" with a Terminal icon) and get
    # confused. Omitting the key means only the helper (which actually calls
    # NSEvent.addGlobalMonitorForEvents) shows up in the pane.
    extendInfo:
        - LSUIElement: true
        - LSMinimumSystemVersion: "11.0"
    notarize: false
dmg:
    # Stable filename (no version) → install.sh can hit the same URL across
    # releases and GitHub `/releases/latest/download/` never 404s.
    artifactName: ${name}-${arch}.${ext}
linux:
    target:
        - AppImage
        - snap
        - deb
    maintainer: electronjs.org
    category: Utility
appImage:
    artifactName: ${name}-${version}.${ext}
npmRebuild: false
publish:
    provider: generic
    url: https://example.com/auto-updates
