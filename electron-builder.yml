appId: com.clipstack.app
productName: ClipStack
directories:
    buildResources: build
files:
    - "!**/.vscode/*"
    - "!src/*"
    - "!electron.vite.config.{js,ts,mjs,cjs}"
    - "!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}"
    - "!{.env,.env.*,.npmrc,pnpm-lock.yaml}"
    - "!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}"
asarUnpack:
    - resources/**
win:
    executableName: clipstack
nsis:
    artifactName: ${name}-${version}-setup.${ext}
    shortcutName: ${productName}
    uninstallDisplayName: ${productName}
    createDesktopShortcut: always
mac:
    category: public.app-category.utilities
    minimumSystemVersion: "11.0"
    # Build unsigned: set `CSC_IDENTITY_AUTO_DISCOVERY=false` khi chạy `npm run
    # build:mac`. install.sh dùng `xattr -cr` để tránh cảnh báo Gatekeeper.
    # KHÔNG hardcode `identity: null` (skip sign hoàn toàn tạo bundle broken) và
    # KHÔNG chạy `codesign --deep --force` thủ công trên .app — cả 2 gây
    # `task_name_for_pid: (os/kern) failure (5)` khi app khởi động.
    target:
        - target: dmg
          arch:
              - arm64
              - x64
    entitlementsInherit: build/entitlements.mac.plist
    extendInfo:
        - LSUIElement: true
        - LSMinimumSystemVersion: "11.0"
        - NSAccessibilityUsageDescription: ClipStack simulates ⌘V to paste your selected clipboard item into the active app.
    notarize: false
dmg:
    # ${arch} = arm64 / x64 → xuất 2 file DMG riêng, không đè nhau.
    artifactName: ${name}-${version}-${arch}.${ext}
linux:
    target:
        - AppImage
        - snap
        - deb
    maintainer: electronjs.org
    category: Utility
appImage:
    artifactName: ${name}-${version}.${ext}
npmRebuild: false
publish:
    provider: generic
    url: https://example.com/auto-updates
