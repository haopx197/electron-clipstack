appId: com.clipstack.app
productName: ClipStack
directories:
    buildResources: build
files:
    - "!**/.vscode/*"
    - "!src/*"
    - "!electron.vite.config.{js,ts,mjs,cjs}"
    - "!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}"
    - "!{.env,.env.*,.npmrc,pnpm-lock.yaml}"
    - "!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}"
asarUnpack:
    - resources/**
win:
    executableName: clipstack
nsis:
    artifactName: ${name}-${version}-setup.${ext}
    shortcutName: ${productName}
    uninstallDisplayName: ${productName}
    createDesktopShortcut: always
mac:
    category: public.app-category.utilities
    minimumSystemVersion: "11.0"
    # Build unsigned: set `CSC_IDENTITY_AUTO_DISCOVERY=false` when running
    # `npm run build:mac`. install.sh uses `xattr -cr` to avoid the Gatekeeper
    # warning. Do NOT hardcode `identity: null` (skipping signing entirely
    # produces a broken bundle) and do NOT run `codesign --deep --force`
    # manually on the .app — both cause `task_name_for_pid: (os/kern)
    # failure (5)` on launch.
    target:
        - target: dmg
          arch:
              - arm64
              - x64
    entitlementsInherit: build/entitlements.mac.plist
    extendInfo:
        - LSUIElement: true
        - LSMinimumSystemVersion: "11.0"
        - NSAccessibilityUsageDescription: ClipStack simulates ⌘V to paste your selected clipboard item into the active app.
    notarize: false
dmg:
    # Stable filename (no version) → install.sh can hit the same URL across
    # releases and GitHub `/releases/latest/download/` never 404s.
    artifactName: ${name}-${arch}.${ext}
linux:
    target:
        - AppImage
        - snap
        - deb
    maintainer: electronjs.org
    category: Utility
appImage:
    artifactName: ${name}-${version}.${ext}
npmRebuild: false
publish:
    provider: generic
    url: https://example.com/auto-updates
